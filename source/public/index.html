<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SquadFit — Ghép đội theo ràng buộc đa biến</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <!-- ═══════════════ Thanh điều hướng dọc ═══════════════ -->
      <aside class="sidebar">
        <a class="sidebar__brand" href="#/">
          <span class="logo">SF</span>
          <span>
            <strong>SquadFit</strong>
            <span class="tagline">Ghép đội theo ràng buộc</span>
          </span>
        </a>

        <div class="sidebar__card">
          <span class="avatar">BT</span>
          <span>
            <strong>Ban tổ chức</strong>
            <span class="sidebar__card-sub">SPD Challenge 2026</span>
          </span>
        </div>

        <nav class="sidebar__nav" aria-label="Điều hướng chính">
          <a class="nav-item" href="#/" data-nav="dashboard">
            <svg class="nav-item__icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            Dự án
          </a>

          <a class="nav-item" href="#/du-an/moi" data-nav="create">
            <svg class="nav-item__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Dự án mới
          </a>
        </nav>

        <div class="sidebar__foot">
          <p class="hint" id="engine-note"></p>
          <p class="hint">Đội <strong>ronaldosiuuu</strong> · SPD Challenge 2026</p>
        </div>
      </aside>

      <!-- ═══════════════ Vùng nội dung ═══════════════ -->
      <div class="main">
        <!-- ═══════════════ Header dính trên vùng nội dung ═══════════════ -->
        <header class="appbar">
          <div class="appbar__title">
            <span class="appbar__eyebrow" id="appbar-eyebrow">SquadFit</span>
            <h1 id="appbar-heading">Dự án của bạn</h1>
          </div>
          <div class="appbar__actions">
            <span class="badge badge--muted" id="appbar-status">—</span>
            <a class="btn btn--sm" href="#/du-an/moi">Dự án mới</a>
          </div>
        </header>

        <main id="view" class="view" aria-live="polite">
          <p class="empty">Đang tải…</p>
        </main>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
